# Local backend, real production StreamAPI over TLS.
server:
  address: 127.0.0.1
  port: 18081

attendance:
  activation:
    start-timeout: 2500ms
  streamapi:
    target: calls.vareonix.cc:443
    plaintext: false

logging:
  file:
    name: logs/attendance.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
  level:
    ru.itmo.plugins.attendance: DEBUG
